<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Transaction</title>
</head>
<body>
<h1>Add transactions</h1>
<input id="value" type="number" name="value" step="0.01" placeholder="Value">
<input id="vendor" type="text" name="vendor" placeholder="Vendor">
<button onclick="addTransaction()">Add</button>
<script>
    async function addTransaction() {
        const value = parseFloat(document.getElementById('value').value);
        const vendor = document.getElementById('vendor').value;
        const transaction = { value: value, vendor: vendor };

        const result = await fetch('/transactions', {
            method: 'POST',
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify(transaction)
        });

        const text = await result.text();
        alert(text);
    }
</script>
</body>
</html>
